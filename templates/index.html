<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid #333;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: background 0.2s;
        }

        .video-overlay:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .video-overlay.hidden {
            display: none;
        }

        .overlay-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #262626;
            color: #ffffff;
            border: 1px solid #404040;
        }

        .btn-secondary:hover {
            background: #333333;
        }

        .results {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #333;
        }

        .results.hidden {
            display: none;
        }

        .results-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .result-grid {
            display: grid;
            gap: 12px;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background: #262626;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .result-item img {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
        }

        .emotion-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2563eb;
        }

        .status-message {
            text-align: center;
            color: #888;
            padding: 2rem;
        }

        footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.75rem;
            color: #666;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Detector</h1>

        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="video-overlay" id="overlay">
                <div class="overlay-text">Click to start camera</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="analyzeBtn">Analyze Emotion</button>
            <button class="btn-secondary" id="toggleBtn">Stop Camera</button>
        </div>

        <div class="results hidden" id="results">
            <div class="results-title">Detection Results</div>
            <div class="result-grid" id="resultGrid"></div>
        </div>
    </div>

    <footer>Onileowo Taiwo • Computer Science • 23CG034136</footer>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const results = document.getElementById('results');
        const resultGrid = document.getElementById('resultGrid');

        let stream = null;
        let cameraActive = false;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play();
                overlay.classList.add('hidden');
                cameraActive = true;
                toggleBtn.textContent = 'Stop Camera';
            } catch (err) {
                console.error('Camera error:', err);
                showStatus('Camera access denied or unavailable');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            overlay.classList.remove('hidden');
            overlay.querySelector('.overlay-text').textContent = 'Click to start camera';
            cameraActive = false;
            toggleBtn.textContent = 'Start Camera';
        }

        function showStatus(message) {
            results.classList.remove('hidden');
            resultGrid.innerHTML = `<div class="status-message">${message}</div>`;
        }

        async function analyzeEmotion() {
            try {
                if (!cameraActive) {
                    await startCamera();
                    await new Promise(resolve => setTimeout(resolve, 300));
                }

                if (video.readyState < 2) {
                    await new Promise(resolve => {
                        video.onloadedmetadata = () => resolve();
                    });
                }

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise(resolve => 
                    canvas.toBlob(resolve, 'image/jpeg', 0.85)
                );

                if (!blob) throw new Error('Failed to capture image');

                const formData = new FormData();
                formData.append('image', blob, `capture_${Date.now()}.jpg`);

                showStatus('Analyzing...');

                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error || `Server error: ${response.status}`);
                }

                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    showStatus('No faces detected');
                    return;
                }

                results.classList.remove('hidden');
                resultGrid.innerHTML = '';

                data.results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = 'result-item';

                    const img = document.createElement('img');
                    img.src = `data:image/jpeg;base64,${result.face_image}`;
                    img.alt = 'Detected face';

                    const label = document.createElement('div');
                    label.className = 'emotion-label';
                    label.textContent = result.emotion || 'Unknown';

                    item.appendChild(img);
                    item.appendChild(label);
                    resultGrid.appendChild(item);
                });

            } catch (err) {
                console.error('Analysis error:', err);
                showStatus(`Error: ${err.message}`);
            }
        }

        overlay.addEventListener('click', () => {
            if (!cameraActive) startCamera();
        });

        toggleBtn.addEventListener('click', () => {
            if (cameraActive) {
                stopCamera();
            } else {
                startCamera();
            }
        });

        analyzeBtn.addEventListener('click', analyzeEmotion);

        window.addEventListener('beforeunload', stopCamera);
        window.addEventListener('pagehide', stopCamera);
    </script>
</body>
</html>
